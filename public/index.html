<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolsEnabled Site Studio</title><link rel="stylesheet" href="/control.css"></head><body>
<header><div><span class="brand">TOOLSENABLED</span><h1>Site Studio</h1></div><p id="status" role="status">Opening working copy…</p></header>
<main><aside><h2>Your working copy</h2><label for="page">Page</label><select id="page"></select><div class="controls"><button id="pause">Pause editing</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="export">Export working copy</button></div><p id="destination"></p><h2>Checkpoints</h2><label for="checkpoint-label">Checkpoint name</label><input id="checkpoint-label" maxlength="80"><button id="save-checkpoint">Save checkpoint</button><ul id="checkpoints"></ul><h2>Timeline</h2><ol id="timeline"></ol></aside>
<section class="canvas" aria-label="Site preview"><div class="preview-bar"><span>Live preview · scripts disabled</span><button id="refresh">Refresh</button></div><iframe id="preview" title="Working copy preview" sandbox="allow-same-origin"></iframe></section></main>
<dialog id="confirm"><h2>Export this revision?</h2><p id="export-detail"></p><p>Your original is only replaced if it is the configured destination. A backup is retained when replacing it.</p><div class="controls"><button id="cancel">Cancel</button><button id="confirm-export">Confirm export</button></div></dialog>
<p id="message" role="alert"></p><script nonce="__NONCE__" src="/web-app.js"></script></body></html>
